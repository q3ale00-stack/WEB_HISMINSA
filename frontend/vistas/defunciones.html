<section id="view-defunciones" class="view">
  <div class="pac-tabs" role="tablist" aria-label="Formas de buscar defunciones">
    <button type="button" class="pac-tab active" role="tab" aria-selected="true" data-def-tab="simple" onclick="cambiarTabDefunciones('simple')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Buscar defunción
    </button>
    <button type="button" class="pac-tab" role="tab" aria-selected="false" data-def-tab="filtros" id="defTabAvanzada" onclick="cambiarTabDefunciones('filtros')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
      Búsqueda con filtros
    </button>
  </div>
  <div id="defPanelFiltros" class="pac-panel" role="tabpanel" hidden>
    <div id="defAvanzadaApp" class="nominal-app"></div>
  </div>
  <div id="defPanelSimple" class="pac-panel" role="tabpanel">
  <div class="def-hero">
    <form class="def-search" id="formDefunciones" role="search" autocomplete="off">
      <div class="def-search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="qDefunciones" type="search" placeholder="DNI, nombre y apellido o n.º de certificado" aria-label="DNI, nombre y apellido o número de certificado de la persona fallecida">
        <button class="btn btn-primary" type="submit">Buscar</button>
        <button class="btn btn-secondary" type="reset" title="Borrar lo escrito, las fechas y el resultado">Limpiar</button>
      </div>
      <div class="def-search-extra">
        <div class="def-periodos" role="group" aria-label="Periodos rápidos">
          <span>Ver defunciones recientes:</span>
          <button type="button" class="def-periodo" data-def-periodo="7">Últimos 7 días</button>
          <button type="button" class="def-periodo" data-def-periodo="30">Último mes</button>
          <button type="button" class="def-periodo" data-def-periodo="90">Últimos 3 meses</button>
        </div>
        <details class="def-rango" id="defRango">
          <summary>Elegir fechas</summary>
          <div class="def-rango-campos">
            <label class="label" for="desdeDefunciones">Desde<input class="input" id="desdeDefunciones" type="date"></label>
            <label class="label" for="hastaDefunciones">Hasta<input class="input" id="hastaDefunciones" type="date"></label>
          </div>
        </details>
      </div>
    </form>
  </div>
  <div id="resDefunciones" aria-live="polite"></div>
  </div>
</section>
